name: Publish Package

on:
  push:
    tags: [v*]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish-npm:
    needs: checks
    runs-on: ubuntu-24.04
    environment: Publish Package
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate release tag
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('packages/cesium-vector-tileset/package.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Release tag must be v${version}, received ${process.env.GITHUB_REF_NAME}`);
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup npm with Trusted Publishing support
        run: npm install --global npm@12.2.0

      - name: Build library
        run: pnpm build:mvt

      - name: Pack library
        run: pnpm --filter cesium-vector-tileset pack --out "$RUNNER_TEMP/package.tgz"

      - name: Publish to npm with OIDC
        run: |
          version=$(node -p "require('./packages/cesium-vector-tileset/package.json').version")
          if [[ "$version" == *-* ]]; then
            npm publish "$RUNNER_TEMP/package.tgz" --access public --tag next
          else
            npm publish "$RUNNER_TEMP/package.tgz" --access public --tag latest
          fi
